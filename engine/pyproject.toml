[project]
name = "cvengine"
version = "0.1.0"
description = "Lokal ATS/AI-HR resume motoru"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10.0",
  "pdfminer.six>=20240706",
  "python-docx>=1.1.2",
  "reportlab>=4.2.5",
  "rapidfuzz>=3.10.0",
  "httpx>=0.27.2",
  "python-multipart>=0.0.17",
  "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
